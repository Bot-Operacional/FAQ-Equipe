<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente da Equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --bg2: #171b27;
    --bg3: #1e2336;
    --surface: #232940;
    --surface2: #2d3452;
    --accent: #4f8ef7;
    --accent2: #7ab3ff;
    --accent-glow: rgba(79,142,247,0.15);
    --text: #e8ecf7;
    --text2: #8f9abf;
    --text3: #5a6280;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(79,142,247,0.3);
    --user-bg: #1a3a6e;
    --user-border: #2a5ab0;
    --bot-bg: #1e2336;
    --bot-border: rgba(255,255,255,0.07);
    --danger: #e05c6a;
    --success: #4cc98a;
    --radius: 16px;
    --radius-sm: 8px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }

  .app {
    width: 100%;
    max-width: 740px;
    height: 90vh;
    max-height: 820px;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 24px;
    background: var(--bg2);
    overflow: hidden;
    position: relative;
  }

  /* header */
  .header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg3);
    flex-shrink: 0;
  }

  .logo {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2a4fa8, #4f8ef7);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(79,142,247,0.4);
  }

  .header-text { flex: 1; }
  .header-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    letter-spacing: -0.02em;
  }
  .header-sub {
    font-size: 12px; color: var(--text2); margin-top: 1px;
    display: flex; align-items: center; gap: 6px;
  }
  .dot-online {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 6px var(--success);
  }

  .clear-btn {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: 'Sora', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .clear-btn:hover { border-color: var(--accent); color: var(--accent2); background: var(--accent-glow); }

  /* messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }

  /* welcome */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    text-align: center;
    gap: 1rem;
    padding: 2rem;
    animation: fadeUp .4s ease;
  }
  .welcome-icon {
    font-size: 48px;
    filter: drop-shadow(0 0 16px rgba(79,142,247,0.5));
  }
  .welcome h2 {
    font-size: 22px; font-weight: 600; color: var(--text);
    letter-spacing: -0.03em;
  }
  .welcome p { font-size: 14px; color: var(--text2); line-height: 1.7; max-width: 400px; }

  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: .5rem;
  }
  .suggestion {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    font-size: 12.5px;
    cursor: pointer;
    transition: all .15s;
    font-family: 'Sora', sans-serif;
  }
  .suggestion:hover {
    border-color: var(--accent);
    color: var(--accent2);
    background: var(--accent-glow);
  }

  /* message bubble */
  .msg { display: flex; gap: 12px; animation: fadeUp .25s ease; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }
  .msg.bot .avatar { background: linear-gradient(135deg, #2a4fa8, #4f8ef7); }
  .msg.user .avatar { background: var(--surface2); font-size: 12px; font-weight: 600; color: var(--accent2); }

  .bubble {
    max-width: 78%;
    padding: .75rem 1rem;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--bot-border);
    border-top-left-radius: 4px;
    color: var(--text);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-top-right-radius: 4px;
    color: #c8deff;
  }

  /* typing */
  .typing-dots { display: flex; gap: 5px; align-items: center; height: 20px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text3);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .2s; }
  .typing-dots span:nth-child(3) { animation-delay: .4s; }

  /* error */
  .error-msg {
    font-size: 13px; color: var(--danger);
    padding: .5rem 1rem; border-radius: var(--radius-sm);
    background: rgba(224,92,106,0.08);
    border: 1px solid rgba(224,92,106,0.2);
    align-self: center;
    animation: fadeUp .2s ease;
  }

  /* input */
  .input-area {
    padding: 1rem 1.2rem 1.2rem;
    border-top: 1px solid var(--border);
    background: var(--bg3);
    flex-shrink: 0;
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: .7rem 1rem;
    transition: border-color .15s;
  }
  .input-wrap:focus-within { border-color: var(--border2); }

  #msgInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    resize: none;
    min-height: 22px;
    max-height: 140px;
    line-height: 1.5;
  }
  #msgInput::placeholder { color: var(--text3); }

  .send-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all .15s;
    font-size: 16px;
  }
  .send-btn:hover { background: var(--accent2); transform: scale(1.05); }
  .send-btn:active { transform: scale(0.97); }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .input-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text3);
    margin-top: .6rem;
  }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">🤖</div>
    <div class="header-text">
      <div class="header-title">Assistente da Equipe</div>
      <div class="header-sub">
        <div class="dot-online"></div>
        Disponível para ajudar
      </div>
    </div>
    <button class="clear-btn" onclick="clearChat()">Limpar chat</button>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h2>Olá! Como posso ajudar?</h2>
      <p>Sou um assistente de IA para dúvidas do dia a dia. Pergunte sobre processos, comunicação, gestão de tempo, ferramentas de trabalho e muito mais.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion('Tela preta ao tentar acessar a VDI — o que faço?')">Tela preta na VDI</button>
        <button class="suggestion" onclick="sendSuggestion('Como escrever um e-mail profissional de forma clara?')">Como escrever um e-mail profissional?</button>
        <button class="suggestion" onclick="sendSuggestion('Dicas para organizar melhor minha rotina de trabalho')">Organizar minha rotina</button>
        <button class="suggestion" onclick="sendSuggestion('Como dar um feedback construtivo para um colega?')">Feedback construtivo</button>
        <button class="suggestion" onclick="sendSuggestion('Técnicas para conduzir uma reunião eficiente')">Reuniões mais eficientes</button>
        <button class="suggestion" onclick="sendSuggestion('Como lidar com conflitos na equipe de forma profissional?')">Resolver conflitos na equipe</button>
        <button class="suggestion" onclick="sendSuggestion('Explique o método Pomodoro para gestão do tempo')">Método Pomodoro</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="Digite sua dúvida..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">Pressione Enter para enviar · Shift+Enter para nova linha</div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `Você é um assistente virtual de apoio para uma equipe de profissionais. Seu papel é responder dúvidas do cotidiano de trabalho com clareza, objetividade e um tom amigável e respeitoso.

Suas especialidades incluem:
- Comunicação profissional (e-mails, reuniões, apresentações)
- Gestão de tempo e produtividade
- Relacionamento interpessoal e trabalho em equipe
- Processos administrativos e organizacionais
- Ferramentas e tecnologias do ambiente de trabalho
- Liderança e gestão de pessoas
- Bem-estar e equilíbrio no trabalho

Sempre responda em português brasileiro, de forma clara e prática. Quando pertinente, organize a resposta com tópicos ou passos numerados para facilitar a leitura. Seja conciso mas completo.

---
BASE DE CONHECIMENTO — PROBLEMAS TÉCNICOS CONHECIDOS:

Problema: Tela preta ao tentar acessar a VDI
Causa: Provável problema no sistema operacional Windows.
Solução:
1. Faça o login pelo Omnisa Horizon Client ou pelo navegador acessando o endereço https://evdi.bb.com.br/
2. Clique nos três pontinhos abaixo da sua VDI e clique em "Restart Desktop".
3. Aguarde por volta de 5 minutos e tente acessar novamente.

Ao responder sobre esse problema, mencione o link https://evdi.bb.com.br/ de forma clicável.
---`;

let history = [];
let isLoading = false;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isLoading) sendMessage();
  }
}

function removeWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.remove();
}

function addMessage(role, content, isTyping = false) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'bot' ? '✦' : 'EU';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (isTyping) {
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    div.id = 'typing-indicator';
  } else {
    bubble.textContent = content;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { div, bubble };
}

function showError(msg) {
  const div = document.createElement('div');
  div.className = 'error-msg';
  div.textContent = msg;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  setTimeout(() => div.remove(), 5000);
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  removeWelcome();
  inputEl.value = '';
  inputEl.style.height = 'auto';
  isLoading = true;
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  const { div: typingDiv, bubble: typingBubble } = addMessage('bot', '', true);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    if (!response.ok) throw new Error(`Erro ${response.status}`);

    const data = await response.json();
    const reply = data.content.map(b => b.text || '').join('');

    typingDiv.remove();
    addMessage('bot', reply);
    history.push({ role: 'assistant', content: reply });

  } catch (err) {
    typingDiv.remove();
    showError('Não foi possível obter uma resposta. Verifique sua conexão e tente novamente.');
    history.pop();
    console.error(err);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

function sendSuggestion(text) {
  inputEl.value = text;
  sendMessage();
}

function clearChat() {
  history = [];
  messagesEl.innerHTML = '';
  const welcome = document.createElement('div');
  welcome.className = 'welcome';
  welcome.id = 'welcome';
  welcome.innerHTML = `
    <div class="welcome-icon">✦</div>
    <h2>Olá! Como posso ajudar?</h2>
    <p>Sou um assistente de IA para dúvidas do dia a dia. Pergunte sobre processos, comunicação, gestão de tempo, ferramentas de trabalho e muito mais.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="sendSuggestion('Tela preta ao tentar acessar a VDI — o que faço?')">Tela preta na VDI</button>
      <button class="suggestion" onclick="sendSuggestion('Como escrever um e-mail profissional de forma clara?')">Como escrever um e-mail profissional?</button>
      <button class="suggestion" onclick="sendSuggestion('Dicas para organizar melhor minha rotina de trabalho')">Organizar minha rotina</button>
      <button class="suggestion" onclick="sendSuggestion('Como dar um feedback construtivo para um colega?')">Feedback construtivo</button>
      <button class="suggestion" onclick="sendSuggestion('Técnicas para conduzir uma reunião eficiente')">Reuniões mais eficientes</button>
      <button class="suggestion" onclick="sendSuggestion('Como lidar com conflitos na equipe de forma profissional?')">Resolver conflitos na equipe</button>
      <button class="suggestion" onclick="sendSuggestion('Explique o método Pomodoro para gestão do tempo')">Método Pomodoro</button>
    </div>
  `;
  messagesEl.appendChild(welcome);
}
</script>
</body>
</html>
